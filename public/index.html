<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (!localStorage.getItem("se_light_default")) {
            localStorage.setItem("se_light_default", "1");
            localStorage.setItem("theme", "light");
            localStorage.setItem("darkMode", "false");
          }
          var theme = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ShoufBayt</title>

    <meta
      name="description"
      content="ShoufBayt is a modern real estate platform to buy, sell, rent, and manage properties."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
