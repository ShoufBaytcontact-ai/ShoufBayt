<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (!localStorage.getItem("se_light_default")) {
            localStorage.setItem("se_light_default", "1");
            localStorage.setItem("theme", "light");
            localStorage.setItem("darkMode", "false");
          }
          var theme = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ShoufBayt | Buy, sell, and rent homes in Lebanon</title>

    <meta
      name="description"
      content="ShoufBayt is a Lebanon real estate platform to buy, sell, and rent homes. Browse listings, contact agents, and manage properties in one place."
    />
    <link rel="canonical" href="https://shoufbayt.com/" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShoufBayt" />
    <meta property="og:title" content="ShoufBayt | Buy, sell, and rent homes in Lebanon" />
    <meta
      property="og:description"
      content="Browse homes for sale and rent in Lebanon. Find agents and manage listings on ShoufBayt."
    />
    <meta property="og:url" content="https://shoufbayt.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ShoufBayt" />
    <meta
      name="twitter:description"
      content="Buy, sell, and rent homes in Lebanon on ShoufBayt."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
